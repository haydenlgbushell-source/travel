<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F2F1EC"/>
  <!-- Compass needle: the wayfinding mark at the centre of "Wayfare".
       North (ink) over South (the app's own default accent, Cherry Club's
       coral) — a fixed mark for the app itself, independent of whichever
       of the four in-app styles a given trip is set to. Kept within a
       ~300px-diameter circle (59% of the canvas) so it survives Android's
       adaptive-icon safe-zone crop as cleanly as iOS's own squircle mask. -->
  <polygon points="256,98 314,256 198,256" fill="#181A17"/>
  <polygon points="256,414 314,256 198,256" fill="#E14754"/>
  <circle cx="256" cy="256" r="10" fill="#F2F1EC"/>
</svg>

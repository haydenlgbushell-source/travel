[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Keep the function reachable — the catch-all below would otherwise claim it.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: serve index.html for any path the build didn't emit.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

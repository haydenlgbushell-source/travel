[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime handles App Router routing, server components and
# image optimisation. It is auto-installed on Netlify, but pinning it here keeps
# local `netlify build` runs identical to CI.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
